# Site settings. GitHub Pages rebuilds the site automatically after every change.

title: EU Inequality
description: Research on how income, wealth and opportunity are distributed across the people and regions of the European Union, and on better ways to measure it.
lang: en
url: "https://onorante.github.io"
baseurl: "/EU-inequality"
permalink: pretty        # pages are published as /name/ instead of /name.html

# Layout of the whole site. Change one word and every page follows.
# A single page can override any of them in its own front matter, e.g.
#   layout_options:
#     width: wide
layout_options:
  width: standard       # narrow | standard | wide
  header: centered      # inline (logo left, menu right) | centered (logo and menu centred)
  sections: stacked     # split (title left, items right) | stacked (title on top, items in a grid)
  color_scheme: light   # light (always white) | auto (follows the visitor's dark-mode setting)

maintainer:
  name: Luca Onorante
  url: "https://onorante.github.io/"

repository_url: "https://github.com/onorante/EU-inequality"

# Content that comes in many similar entries. Each entry is one file in the
# folder of the same name (_topics, _publications, _events) and gets its own page.
# Templates to copy are in the _templates folder.
collections:
  topics:
    output: true
    permalink: /topics/:name/
  publications:
    output: true
    permalink: /publications/:name/
  events:
    output: true
    permalink: /events/:name/

# Show entries with a date in the future (upcoming events, forthcoming papers).
# Without this, Jekyll would hide them until their date.
future: true

# Settings applied automatically to every entry of a collection.
defaults:
  - scope:
      path: ""
      type: topics
    values:
      layout: topic
      parent: { title: Research topics, url: /topics/ }
  - scope:
      path: ""
      type: publications
    values:
      layout: publication
      parent: { title: Publications, url: /publications/ }
  - scope:
      path: ""
      type: events
    values:
      layout: event
      parent: { title: Events and seminars, url: /events/ }

exclude:
  - README.md
