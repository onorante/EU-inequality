<header class="site-header">
  <div class="wrap site-header-inner">
    <a class="brand" href="{{ '/' | relative_url }}">{% include logo.html %}<span>{{ site.title }}</span></a>
    <nav class="site-nav" aria-label="Main">
      <ul>
        {% for item in site.data.navigation %}<li><a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a></li>
        {% endfor %}
      </ul>
    </nav>
  </div>
</header>
