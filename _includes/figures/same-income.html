{%- comment -%}
  Figure for the topic "Beyond income": the hypothetical example of Anna and Marco.
  Only facts stated in the example are shown; bars show the same income and
  travel times of 10 and 40 minutes to the nearest hospital.
{%- endcomment -%}
<figure class="fig">
  <p class="kicker">In a picture</p>
  <h2 class="fig-title">Same income, different lives</h2>
  <div class="table-scroll">
    <table class="compare">
      <thead>
        <tr><th scope="col"><span class="visually-hidden">Dimension</span></th><th scope="col">Anna</th><th scope="col">Marco</th></tr>
      </thead>
      <tbody>
        <tr>
          <th scope="row">Net income</th>
          <td><span class="bar" style="--w: 100%"></span><span class="bar-label">Same</span></td>
          <td><span class="bar" style="--w: 100%"></span><span class="bar-label">Same</span></td>
        </tr>
        <tr>
          <th scope="row">Home</th>
          <td>Owns a well-insulated flat in a city</td>
          <td class="is-worse">Rents a poorly insulated house in a village</td>
        </tr>
        <tr>
          <th scope="row">Nearest hospital</th>
          <td><span class="bar" style="--w: 25%"></span><span class="bar-label">10 minutes on foot</span></td>
          <td class="is-worse"><span class="bar bar-worse" style="--w: 100%"></span><span class="bar-label">40 minutes by car</span></td>
        </tr>
        <tr>
          <th scope="row">Public transport</th>
          <td>Train station a ten-minute walk away</td>
          <td class="is-worse">Last bus at seven in the evening</td>
        </tr>
        <tr>
          <th scope="row">Heating and fuel</th>
          <td>A smaller share of income</td>
          <td class="is-worse">A larger share of income</td>
        </tr>
        <tr>
          <th scope="row">Jobs within reach</th>
          <td>More</td>
          <td class="is-worse">Fewer</td>
        </tr>
      </tbody>
    </table>
  </div>
  <figcaption>The hypothetical example above, row by row. In income statistics Anna and Marco are equal; on every other line, they are not.</figcaption>
</figure>
