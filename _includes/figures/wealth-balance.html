{%- comment -%}
  Figure for the topic "Wealth and household finances": what makes up the wealth
  of a household. Schematic: the proportions are illustrative, not data.
{%- endcomment -%}
<figure class="fig">
  <p class="kicker">In a picture</p>
  <h2 class="fig-title">What makes up a household's wealth</h2>
  <div class="balance">
    <div class="balance-row">
      <p class="balance-label">What it owns</p>
      <div>
        <div class="balance-track" aria-hidden="true">
          <div class="balance-bar" style="--start: 0%; --w: 100%"><span class="seg seg-1" style="--w: 50%"></span><span class="seg seg-2" style="--w: 14%"></span><span class="seg seg-3" style="--w: 22%"></span><span class="seg seg-4" style="--w: 14%"></span></div>
        </div>
        <ul class="balance-legend">
          <li><span class="key seg-1" aria-hidden="true"></span>Home</li>
          <li><span class="key seg-2" aria-hidden="true"></span>Savings</li>
          <li><span class="key seg-3" aria-hidden="true"></span>Pensions and shares</li>
          <li><span class="key seg-4" aria-hidden="true"></span>Business</li>
        </ul>
      </div>
    </div>
    <div class="balance-row">
      <p class="balance-label">minus what it owes</p>
      <div>
        <div class="balance-track" aria-hidden="true">
          <div class="balance-bar" style="--start: 70%; --w: 30%"><span class="seg seg-debt" style="--w: 75%"></span><span class="seg seg-debt-2" style="--w: 25%"></span></div>
        </div>
        <ul class="balance-legend">
          <li><span class="key seg-debt" aria-hidden="true"></span>Mortgage</li>
          <li><span class="key seg-debt-2" aria-hidden="true"></span>Other loans</li>
        </ul>
      </div>
    </div>
    <div class="balance-row balance-total">
      <p class="balance-label">equals net wealth</p>
      <div>
        <div class="balance-track" aria-hidden="true">
          <div class="balance-bar" style="--start: 0%; --w: 70%"><span class="seg seg-net" style="--w: 100%"></span></div>
        </div>
        <ul class="balance-legend">
          <li><span class="key seg-net" aria-hidden="true"></span>Net wealth: what remains when debts are paid</li>
        </ul>
      </div>
    </div>
  </div>
  <figcaption>Schematic: the proportions are illustrative, not data. Two households with the same income can stand very differently here, depending on whether they inherited a home, how much they owe and what return their savings earn.</figcaption>
</figure>
