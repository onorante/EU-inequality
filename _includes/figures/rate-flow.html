{%- comment -%}
  Figure for the topic "Inequality and the economy": how one interest rate
  decision reaches different households (the hypothetical example).
{%- endcomment -%}
<figure class="fig">
  <p class="kicker">In a picture</p>
  <h2 class="fig-title">One interest rate decision, many effects</h2>
  <div class="flow">
    <div class="flow-node flow-start">
      <strong>The central bank raises interest rates</strong>
      <span>to bring inflation down</span>
    </div>
    <span class="flow-arrow" aria-hidden="true">→</span>
    <ul class="flow-branches">
      <li class="flow-node">
        <span class="tag tag-plain">Pays more</span>
        <strong>Family with a variable-rate mortgage</strong>
        <span>Monthly payments rise</span>
      </li>
      <li class="flow-node">
        <span class="tag tag-plain">Earns more</span>
        <strong>Retired saver</strong>
        <span>Higher interest on deposits</span>
      </li>
      <li class="flow-node">
        <span class="tag tag-plain">At risk</span>
        <strong>Construction worker</strong>
        <span>Higher risk of losing his job as building activity slows</span>
      </li>
    </ul>
    <span class="flow-arrow" aria-hidden="true">→</span>
    <div class="flow-node flow-end">
      <strong>The economy as a whole</strong>
      <span>How each group reacts decides how quickly inflation falls and how deep the slowdown is</span>
    </div>
  </div>
  <figcaption>The hypothetical example above. A model with one average household sees only the overall effect; a model with many different households sees who pays, who gains and who is at risk, and how their reactions add up.</figcaption>
</figure>
