{%- comment -%}
  Figure for the topic "Place, opportunity and social ties": how a place can
  enter a downward spiral (the hypothetical example).
{%- endcomment -%}
<figure class="fig">
  <p class="kicker">In a picture</p>
  <h2 class="fig-title">How a place can empty slowly</h2>
  <ol class="cycle">
    <li>
      <strong>Services close</strong>
      <span>The bank branch, the cinema and the last secondary school</span>
    </li>
    <li>
      <strong>Young people leave</strong>
      <span>They go away to study and do not come back</span>
    </li>
    <li>
      <strong>House prices fall</strong>
      <span>Homes are worth less to the families who own them</span>
    </li>
    <li>
      <strong>Those who stay are held back</strong>
      <span>It becomes harder to borrow, or to sell and move</span>
    </li>
  </ol>
  <p class="cycle-return"><span>With fewer people and less money spent locally, more services close, and the cycle starts again.</span></p>
  <figcaption>The hypothetical example above. Average income may barely change at first; what shrinks are opportunities and social life. Local measures can show such spirals early.</figcaption>
</figure>
