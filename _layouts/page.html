---
layout: default
---
<header class="page-head">
  <div class="wrap">
    {% if page.icon %}<span class="icon-tile icon-tile-large">{% include icon.html name=page.icon %}</span>{% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.intro %}<p class="lead">{{ page.intro }}</p>{% endif %}
  </div>
</header>
<div class="wrap page-body prose">
{{ content }}
</div>
